[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vyom-literature-prototype"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"anthropic>=0.60,<1",
	"fastapi>=0.115,<1",
	"psycopg[binary]>=3.2,<4",
	"python-dotenv>=1,<2",
	"uvicorn[standard]>=0.30,<1",
	"typesafe-sdk>=0.1.0,<1",
]

[project.scripts]
vyom-fetch = "vyom_literature.fetch:main"
vyom-sweep = "vyom_literature.sweep:main"
vyom-api = "vyom_literature.server:main"
vyom-gold-import = "vyom_literature.gold_import:main"
vyom-report = "vyom_literature.weekly_report:main"
vyom-export-training = "vyom_literature.training_export:main"

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]